name: Release

# Junta o que o Giochi System construiu e publica: release do GitHub com os
# artefatos e site de download no GitHub Pages.
#
# Este repositório não compila nada (ver AGENTS.md §8). O build do sistema é do
# GIOCHI-SYSTEM; aqui ele é *baixado* como artefato e empacotado.
#
# ## Por que há um job `discover`
#
# Os aparelhos são uma matriz, não um. Publicar um por execução parece simples e
# tem um defeito que só aparece depois: cada execução gera o SEU site, e a
# segunda publica uma página com um card só. O `discover` lê
# `device/devices.json` do GIOCHI-SYSTEM — a fonte da verdade — e devolve a
# lista de habilitados. Um job empacota cada um; a release e o site saem uma vez
# com todos.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Devices separados por vírgula (vazio = os habilitados no Giochi System)"
        required: false
        default: ""
        type: string
      version:
        description: "Versão publicada (vazio = nome da tag)"
        required: false
        default: ""
        type: string
      system_run_id:
        description: "Run do Giochi System (vazio = último build bem-sucedido)"
        required: false
        default: ""
        type: string
      system_repo:
        description: "Repositório do Giochi System"
        required: false
        default: "xtrempkch-droid/GIOCHI-SYSTEM"
        type: string
      app_repo:
        description: "Repositório do Giochi app"
        required: false
        default: "xtrempkch-droid/GIOCHI-APP"
        type: string
      games_repo:
        description: "Repositório dos jogos (vazio = padrão; use '-' para não usar)"
        required: false
        default: "xtrempkch-droid/GIOCHI-GAMES"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYSTEM_REPO: ${{ inputs.system_repo || 'xtrempkch-droid/GIOCHI-SYSTEM' }}
  APP_REPO: ${{ inputs.app_repo || 'xtrempkch-droid/GIOCHI-APP' }}
  GAMES_REPO: ${{ inputs.games_repo || 'xtrempkch-droid/GIOCHI-GAMES' }}
  GH_TOKEN: ${{ secrets.SYSTEM_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  discover:
    name: Descobrir os devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
      # O JSON sai pronto daqui. Montá-lo na expressão da matriz exigiria
      # `replace()`, que **não existe** nas expressões do Actions — e um nome
      # de função inexistente não falha no job: invalida o arquivo inteiro, e
      # o GitHub cria uma execução sem nenhum job.
      devices_json: ${{ steps.list.outputs.devices_json }}
      run_id: ${{ steps.system.outputs.run }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver a versão
        id: version
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [ -z "$VERSION" ]; then
            # Tag `v0.1.0` → `0.1.0`; num push de branch (não deve acontecer,
            # o gatilho é tag) o nome do ref vira a versão.
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "ERRO: não consegui resolver a versão" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versão: $VERSION"

      - name: Checkout do Giochi System (só o catálogo de devices)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSTEM_REPO }}
          path: .deps/system-repo
          token: ${{ env.GH_TOKEN }}
          sparse-checkout: |
            device/devices.json
            device
          sparse-checkout-cone-mode: false

      - name: Listar os devices habilitados
        id: list
        run: |
          set -euo pipefail
          MANUAL='${{ inputs.devices }}'
          if [ -n "$MANUAL" ]; then
            LIST=$(printf '%s' "$MANUAL" | tr -d ' ')
            echo "lista informada: $LIST"
          else
            LIST=$(node -e '
              const fs = require("node:fs");
              const raiz = ".deps/system-repo";
              const idx = JSON.parse(fs.readFileSync(`${raiz}/device/devices.json`, "utf8"));
              const ids = (idx.devices || []).filter((d) => d.enabled).map((d) => d.id);
              if (ids.length === 0) {
                console.error("nenhum device habilitado em device/devices.json");
                process.exit(1);
              }
              process.stdout.write(ids.join(","));
            ')
            echo "habilitados no Giochi System: $LIST"
          fi
          echo "devices=$LIST" >> "$GITHUB_OUTPUT"
          JSON=$(node -e 'process.stdout.write(JSON.stringify(process.argv[1].split(",").filter(Boolean)))' "$LIST")
          echo "devices_json=$JSON" >> "$GITHUB_OUTPUT"
          echo "matriz: $JSON"

      - name: Resolver o build do sistema
        id: system
        run: |
          set -euo pipefail
          RUN_ID='${{ inputs.system_run_id }}'
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api \
              "repos/$SYSTEM_REPO/actions/workflows/build-linux-arm64.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERRO: nenhum build bem-sucedido do Giochi System." >&2
            echo "Construa os devices lá primeiro, ou passe system_run_id." >&2
            echo "Repositório privado: defina o secret SYSTEM_TOKEN (PAT com actions:read)." >&2
            exit 1
          fi
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "usando o run $RUN_ID de $SYSTEM_REPO"

  package:
    name: Empacotar ${{ matrix.device }}
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.discover.outputs.devices_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes
        run: node tests/run-all.mjs

      - name: Dependências de inspeção da imagem
        # `debugfs` (e2fsprogs) lê e escreve dentro do ext4 sem montar;
        # `readelf` (binutils) lista as `DT_NEEDED` dos binários dos apps;
        # `sfdisk` lê a tabela de partição do cartão e `e2fsck` prova que o
        # rootfs alterado continua montável. O ubuntu-24.04 já traz quase tudo —
        # a lista explícita evita depender do que a imagem do runner tem.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs binutils file fdisk

      - name: Checkout do catálogo de apps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          path: .deps/app
          token: ${{ env.GH_TOKEN }}
          # O catálogo é um punhado de arquivos por app; o repositório tem
          # ~5,8 GB de `target/` de Rust versionado. Materializar tudo isso
          # consome o disco do runner antes do empacotamento começar.
          #
          # Os padrões abaixo são exatamente o que `apps.mjs` lê — `apps.json`,
          # `metadata.json`, `forge.json`, `capa.png`, `bin/` e `assets/` — e
          # foram conferidos contra a árvore commitada: 39 de 39 arquivos, sem
          # sobra. `capa.png` e `bin/` são lidos pelo validador, então um
          # padrão errado falha com erro, não em silêncio.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/apps.json
            /app/*/metadata.json
            /app/*/forge.json
            /app/*/capa.png
            /app/*/bin/
            /app/*/assets/
            /app/*/config/
          sparse-checkout-cone-mode: false

      - name: Conferir o recorte do catálogo de apps
        # O `sparse-checkout` acima é uma afirmação sobre o formato do
        # repositório, e afirmação sobre repositório de terceiro envelhece: um
        # diretório novo de dados (foi assim com `config/`) deixaria de ser
        # materializado em silêncio, e a imagem sairia sem ele. Aqui a perda
        # vira erro com a lista do que faltou.
        run: node scripts/check-checkout.mjs --repo .deps/app --catalog .deps/app/app

      - name: Checkout dos jogos
        # O repositório de jogos é o terceiro catálogo. Ele pode estar em
        # estruturação — jogo sem `bin/` exportado, ou repositório vazio — e
        # nada disso pode derrubar o release do sistema: um catálogo que não
        # carrega vira aviso, e a imagem sai com os apps que existem.
        #
        # Vale o mesmo para o repositório privado que o token não alcança: o
        # `continue-on-error` transforma "sem acesso" em "sem jogos".
        if: env.GAMES_REPO != '-'
        continue-on-error: true
        id: games
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAMES_REPO }}
          path: .deps/games
          token: ${{ env.GH_TOKEN }}
          # Mesmo recorte, mesmo motivo, e maior: são ~9 GB no checkout
          # completo (`target/` e `vendor/` de quatro jogos Rust). Conferido
          # contra a árvore commitada: 66 de 66 arquivos do catálogo.
          #
          # `assets/` entra aqui porque a fase `apps` passou a copiá-lo para a
          # imagem — sem esta linha o jogo iria para o cartão sem textura.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*/metadata.json
            /*/forge.json
            /*/capa.png
            /*/bin/
            /*/assets/
            /*/config/
          sparse-checkout-cone-mode: false

      - name: Conferir o recorte do catálogo de jogos
        # Mesma checagem do catálogo de apps, e aqui ela importa mais: o
        # `continue-on-error` do checkout transformaria um recorte errado em
        # "sem jogos", e a release sairia verde sem eles.
        if: env.GAMES_REPO != '-' && steps.games.outcome == 'success'
        run: node scripts/check-checkout.mjs --repo .deps/games --catalog .deps/games

      - name: Baixar os artefatos do sistema
        uses: actions/download-artifact@v4
        with:
          name: giochi-system-${{ matrix.device }}
          path: .deps/system
          repository: ${{ env.SYSTEM_REPO }}
          run-id: ${{ needs.discover.outputs.run_id }}
          github-token: ${{ env.GH_TOKEN }}

      - name: Empacotar a release
        run: |
          # `--inject-apps` fecha a lacuna que o CI tem por desenho: o build do
          # GIOCHI-SYSTEM não vê o catálogo de apps, então a imagem chega sem
          # eles. A injeção escreve sem montar — no alvo virtual direto no
          # ext4, no cartão extraindo a partição, alterando, conferindo com
          # `e2fsck` e devolvendo ao offset.
          #
          # Os catálogos são independentes: o launcher e a loja vêm do Giochi
          # app, os jogos vêm do repositório de jogos. `--apps` é repetível
          # justamente para não obrigar a copiar pasta de um repositório para
          # o outro.
          apps=(--apps .deps/app/app)
          if [ -d .deps/games ] && [ -n "$(ls -A .deps/games 2>/dev/null)" ]; then
            apps+=(--apps .deps/games)
          else
            echo "::warning::catálogo de jogos vazio ou inacessível; a imagem sai só com os apps"
          fi

          node scripts/assemble.mjs package \
            --system .deps/system \
            "${apps[@]}" \
            --out "dist/${{ matrix.device }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --compress xz \
            --inject-apps

      - name: Guardar o dist deste device
        uses: actions/upload-artifact@v4
        with:
          name: giochi-os-dist-${{ matrix.device }}
          path: dist/${{ matrix.device }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar release e site
    needs: [discover, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reunir os dist de todos os devices
        uses: actions/download-artifact@v4
        with:
          pattern: giochi-os-dist-*
          path: dist
          # Uma pasta por artefato (`dist/giochi-os-dist-<device>/`) em vez de
          # tudo achatado: achatado, dois `release.json` viram um e não há como
          # saber qual aparelho se perdeu. O passo seguinte renomeia cada pasta
          # para o `device.id` que está dentro do próprio `release.json`.
          merge-multiple: false

      - name: Batizar os diretórios pelo aparelho
        # O nome do diretório que o `download-artifact` cria não é contrato.
        # Quem sabe qual aparelho é está no `release.json` de dentro.
        run: node scripts/flatten-release.mjs --dist dist --layout-only

      - name: Conferir o que foi reunido
        run: |
          set -euo pipefail
          echo "dist/ tem:"
          find dist -maxdepth 6 | sort | head -80
          # Sem esta checagem, um download incompleto viraria uma página com
          # menos cards — publicada, verde.
          COUNT=$(find dist -name release.json | wc -l)
          # `wc -l` conta CARACTERES DE NOVA LINHA, não linhas: `printf '%s' "a,b"`
          # vira "a\nb", que tem uma nova linha — dois aparelhos contavam como
          # um. A conferência existia justamente para pegar aparelho perdido, e
          # era cega para o caso de dois. Medido na v0.1.2, publicada com os
          # nomes colidindo e o contador dizendo 1 de 1.
          #
          # A contagem agora usa o MESMO JSON da matriz, então não há como a
          # expectativa e o número de jobs discordarem.
          EXPECTED=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' \
            '${{ needs.discover.outputs.devices_json }}')
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            # A anotação é o único lugar da falha que dá para ler sem baixar
            # log: o `::error::` vira anotação do check-run, e o check-run é
            # público. O `stderr` do passo, não.
            LISTA=$(find dist -maxdepth 5 | sort | tr '\n' ' ')
            echo "::error::esperava $EXPECTED release(s), encontrei $COUNT. dist: $LISTA"
            exit 1
          fi

      - name: Desdobrar os nomes que se repetem entre aparelhos
        # Os anexos de uma release são PLANOS: `dist/<device>/SHA256SUMS` de um
        # aparelho sobrescreve o do outro. Medido na v0.1.1 — o `SHA256SUMS`
        # publicado tinha só a linha do X55, e quem baixasse o disco do QEMU
        # rodava `sha256sum -c` contra um nome que não existia. O mesmo valia
        # para `README.txt` e `release.json`.
        #
        # A lógica está em `scripts/lib/release-assets.mjs` porque ela errou
        # uma vez: em YAML não daria para testá-la. O CLI também falha se
        # sobrar qualquer nome-base repetido — a regressão vira erro aqui, não
        # um anexo perdido na release publicada.
        run: node scripts/flatten-release.mjs --dist dist

      - name: Escrever o texto da release
        # Depois do desdobramento: cada README já cita o próprio arquivo de
        # checksum, e é esse texto que vai no corpo da release.
        run: |
          set -euo pipefail
          {
            echo "Giochi OS ${{ needs.discover.outputs.version }}"
            echo
            for arquivo in dist/*-README.txt; do
              [ -f "$arquivo" ] || continue
              cat "$arquivo"
              echo
              echo "---"
              echo
            done
          } > dist/README-RELEASE.md
          echo "corpo da release: $(wc -l < dist/README-RELEASE.md) linha(s)"

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.discover.outputs.version) }}
          name: Giochi OS ${{ needs.discover.outputs.version }}
          body_path: dist/README-RELEASE.md
          # `dist/**/*` e não `dist/*`: os artefatos estão em `dist/<device>/`, e
          # o glob raso pegaria só a pasta — o `action-gh-release` publica os
          # arquivos de dentro, mas o caminho tem de casar.
          files: dist/**/*
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Gerar a página de download na raiz
        # UM arquivo: CSS no `<style>`, marca em SVG, logo em base64, e os
        # downloads apontando para os anexos desta release. É a página que o
        # GitHub Pages publica — o Pages publica o REPOSITÓRIO, então não há job
        # de deploy, nem artefato de site, nem `build_type: workflow` a exigir.
        run: node scripts/build-site.mjs --dist dist --single-file --out index.html

      - name: Publicar a página no branch
        # Roda depois da release: se a página falhar, os arquivos já estão
        # publicados e o próximo run conserta a página.
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          # Regera no checkout do branch: `dist/` é ignorado pelo git e sobrevive
          # ao checkout, então os dados são os desta execução.
          node scripts/build-site.mjs --dist dist --single-file --out index.html
          if git diff --quiet -- index.html; then
            echo "index.html já estava atualizado."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "site: página de download da ${{ needs.discover.outputs.version }}" \
              -- index.html
          # O main pode ter andado durante o empacotamento; rebase antes de
          # empurrar evita falhar por non-fast-forward no fim de tudo.
          git push origin main || { git pull --rebase origin main && git push origin main; }
