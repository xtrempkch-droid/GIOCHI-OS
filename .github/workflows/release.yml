name: Release

# Junta o que o Giochi System construiu e publica: release do GitHub com os
# artefatos e site de download no GitHub Pages.
#
# Este repositório não compila nada (ver AGENTS.md §8). O build do sistema é do
# GIOCHI-SYSTEM; aqui ele é *baixado* como artefato e empacotado.
#
# ## Por que há um job `discover`
#
# Os aparelhos são uma matriz, não um. Publicar um por execução parece simples e
# tem um defeito que só aparece depois: cada execução gera o SEU site, e a
# segunda publica uma página com um card só. O `discover` lê
# `device/devices.json` do GIOCHI-SYSTEM — a fonte da verdade — e devolve a
# lista de habilitados. Um job empacota cada um; a release e o site saem uma vez
# com todos.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Devices separados por vírgula (vazio = os habilitados no Giochi System)"
        required: false
        default: ""
        type: string
      version:
        description: "Versão publicada (vazio = nome da tag)"
        required: false
        default: ""
        type: string
      system_run_id:
        description: "Run do Giochi System (vazio = último build bem-sucedido)"
        required: false
        default: ""
        type: string
      system_repo:
        description: "Repositório do Giochi System"
        required: false
        default: "xtrempkch-droid/GIOCHI-SYSTEM"
        type: string
      app_repo:
        description: "Repositório do Giochi app"
        required: false
        default: "xtrempkch-droid/GIOCHI-APP"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYSTEM_REPO: ${{ inputs.system_repo || 'xtrempkch-droid/GIOCHI-SYSTEM' }}
  APP_REPO: ${{ inputs.app_repo || 'xtrempkch-droid/GIOCHI-APP' }}
  GH_TOKEN: ${{ secrets.SYSTEM_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  discover:
    name: Descobrir os devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
      run_id: ${{ steps.system.outputs.run }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver a versão
        id: version
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [ -z "$VERSION" ]; then
            # Tag `v0.1.0` → `0.1.0`; num push de branch (não deve acontecer,
            # o gatilho é tag) o nome do ref vira a versão.
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "ERRO: não consegui resolver a versão" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versão: $VERSION"

      - name: Checkout do Giochi System (só o catálogo de devices)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSTEM_REPO }}
          path: .deps/system-repo
          token: ${{ env.GH_TOKEN }}
          sparse-checkout: |
            device/devices.json
            device
          sparse-checkout-cone-mode: false

      - name: Listar os devices habilitados
        id: list
        run: |
          set -euo pipefail
          MANUAL='${{ inputs.devices }}'
          if [ -n "$MANUAL" ]; then
            LIST=$(printf '%s' "$MANUAL" | tr -d ' ')
            echo "lista informada: $LIST"
          else
            LIST=$(node -e '
              const fs = require("node:fs");
              const raiz = ".deps/system-repo";
              const idx = JSON.parse(fs.readFileSync(`${raiz}/device/devices.json`, "utf8"));
              const ids = (idx.devices || []).filter((d) => d.enabled).map((d) => d.id);
              if (ids.length === 0) {
                console.error("nenhum device habilitado em device/devices.json");
                process.exit(1);
              }
              process.stdout.write(ids.join(","));
            ')
            echo "habilitados no Giochi System: $LIST"
          fi
          echo "devices=$LIST" >> "$GITHUB_OUTPUT"

      - name: Resolver o build do sistema
        id: system
        run: |
          set -euo pipefail
          RUN_ID='${{ inputs.system_run_id }}'
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api \
              "repos/$SYSTEM_REPO/actions/workflows/build-linux-arm64.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERRO: nenhum build bem-sucedido do Giochi System." >&2
            echo "Construa os devices lá primeiro, ou passe system_run_id." >&2
            echo "Repositório privado: defina o secret SYSTEM_TOKEN (PAT com actions:read)." >&2
            exit 1
          fi
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "usando o run $RUN_ID de $SYSTEM_REPO"

  package:
    name: Empacotar ${{ matrix.device }}
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(format('["{0}"]', replace(needs.discover.outputs.devices, ',', '","'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes
        run: node tests/run-all.mjs

      - name: Dependências de inspeção da imagem
        # `debugfs` (e2fsprogs) lê e escreve dentro do ext4 sem montar;
        # `readelf` (binutils) lista as `DT_NEEDED` dos binários dos apps;
        # `sfdisk` lê a tabela de partição do cartão e `e2fsck` prova que o
        # rootfs alterado continua montável. O ubuntu-24.04 já traz quase tudo —
        # a lista explícita evita depender do que a imagem do runner tem.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs binutils file fdisk

      - name: Checkout do catálogo de apps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          path: .deps/app
          token: ${{ env.GH_TOKEN }}

      - name: Baixar os artefatos do sistema
        uses: actions/download-artifact@v4
        with:
          name: giochi-system-${{ matrix.device }}
          path: .deps/system
          repository: ${{ env.SYSTEM_REPO }}
          run-id: ${{ needs.discover.outputs.run_id }}
          github-token: ${{ env.GH_TOKEN }}

      - name: Empacotar a release
        run: |
          # `--inject-apps` fecha a lacuna que o CI tem por desenho: o build do
          # GIOCHI-SYSTEM não vê o catálogo de apps, então a imagem chega sem
          # eles. A injeção escreve sem montar — no alvo virtual direto no
          # ext4, no cartão extraindo a partição, alterando, conferindo com
          # `e2fsck` e devolvendo ao offset.
          node scripts/assemble.mjs package \
            --system .deps/system \
            --apps .deps/app/app \
            --out "dist/${{ matrix.device }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --compress xz \
            --inject-apps

      - name: Guardar o dist deste device
        uses: actions/upload-artifact@v4
        with:
          name: giochi-os-dist-${{ matrix.device }}
          path: dist/${{ matrix.device }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar release e site
    needs: [discover, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reunir os dist de todos os devices
        uses: actions/download-artifact@v4
        with:
          pattern: giochi-os-dist-*
          path: dist
          merge-multiple: true

      - name: Conferir o que foi reunido
        run: |
          set -euo pipefail
          echo "dist/ tem:"
          find dist -name release.json | sort
          # Sem esta checagem, um download incompleto viraria um site com menos
          # cards — e o deploy publicaria a página, verde.
          COUNT=$(find dist -name release.json | wc -l)
          EXPECTED=$(printf '%s' "${{ needs.discover.outputs.devices }}" | tr ',' '\n' | wc -l)
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "ERRO: esperava $EXPECTED release(s), encontrei $COUNT" >&2
            exit 1
          fi

      - name: Gerar o site
        run: node scripts/build-site.mjs --dist dist

      - name: Escrever o texto da release
        run: |
          set -euo pipefail
          {
            echo "Giochi OS ${{ needs.discover.outputs.version }}"
            echo
            for dir in dist/*/; do
              [ -f "$dir/README.txt" ] || continue
              cat "$dir/README.txt"
              echo
              echo "---"
              echo
            done
          } > dist/README-RELEASE.md

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.discover.outputs.version) }}
          name: Giochi OS ${{ needs.discover.outputs.version }}
          body_path: dist/README-RELEASE.md
          # `dist/**/*` e não `dist/*`: os artefatos estão em `dist/<device>/`, e
          # o glob raso pegaria só a pasta — o `action-gh-release` publica os
          # arquivos de dentro, mas o caminho tem de casar.
          files: dist/**/*
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Preparar o site para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publicar o site
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
