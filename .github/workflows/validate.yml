name: Validate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "package.json"
      # `release.yml` inválido não falha num job: o GitHub cria uma execução
      # SEM nenhum job, com a mensagem só no HTML. O teste que lê os workflows
      # em busca de função inexistente é o único jeito de isso aparecer num PR
      # — e ele precisa rodar quando o workflow muda. Medido em 15/11/2026:
      # uma `replace()` (que não existe no Actions) derrubou todos os releases
      # e o `Validate` ficou verde porque o filtro de caminho não cobria aqui.
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node tests/run-all.mjs
