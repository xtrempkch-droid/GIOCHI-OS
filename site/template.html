<!DOCTYPE html>
<html lang="<!--LANG-->" dir="<!--DIR-->">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="meta.title"></title>
<meta name="description" data-i18n-content="meta.description" content="">
<link rel="icon" href="<!--FAVICON-->">
<meta property="og:type" content="website">
<meta property="og:title" data-i18n-content="meta.title" content="">
<meta property="og:description" data-i18n-content="meta.ogDescription" content="">
<meta name="twitter:card" content="summary_large_image">
<!--STYLE-->
</head>
<body>

<!--
  Cada texto visível carrega um atributo `data-i18n` com a chave. O gerador
  escreve aqui o idioma
  padrão, então a página inteira é legível sem JavaScript; o script no fim só
  troca os textos quando o visitante escolhe outro idioma (ou quando o navegador
  já vem em outro). Nenhum texto vive só no script: se o JS falhar, nada some.
-->
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">
      <!--MARK-->
      <span>Giochi OS</span>
    </a>

    <!--
      Submenus com `<details>`: abrem sem JavaScript, respondem ao teclado e não
      dependem de hover — que não existe em tela de toque.
    -->
    <nav class="menu" aria-label="Giochi OS">
      <ul>
        <li>
          <details class="submenu">
            <summary data-i18n="nav.download"></summary>
            <ul>
              <!--NAV_DOWNLOADS-->
              <li><a href="#verificar" data-i18n="nav.checksum"></a></li>
            </ul>
          </details>
        </li>
        <li>
          <details class="submenu">
            <summary data-i18n="nav.install"></summary>
            <ul>
              <li><a href="#cartao" data-i18n="nav.sdCard"></a></li>
              <li><a href="#qemu" data-i18n="nav.qemu"></a></li>
              <li><a href="#verificar" data-i18n="nav.checksum"></a></li>
            </ul>
          </details>
        </li>
        <li>
          <details class="submenu">
            <summary data-i18n="nav.devices"></summary>
            <ul>
              <li><a href="#aparelhos" data-i18n="nav.deviceList"></a></li>
              <!--NAV_DEVICES-->
            </ul>
          </details>
        </li>
        <li>
          <details class="submenu">
            <summary data-i18n="nav.project"></summary>
            <ul>
              <li><a href="#sobre" data-i18n="nav.about"></a></li>
              <li><a href="#repos" data-i18n="nav.repos"></a></li>
              <li><a href="#licencas" data-i18n="nav.license"></a></li>
            </ul>
          </details>
        </li>
        <li>
          <!--
            O seletor de idioma. Os 10 nomes ficam no seu próprio alfabeto: quem
            procura russo encontra "Русский" mesmo sem ler a página em inglês.
          -->
          <details class="submenu idioma">
            <summary>
              <span data-i18n="nav.language"></span>
              <span class="idioma-atual" id="idioma-atual"><!--IDIOMA_ATUAL--></span>
            </summary>
            <ul class="lista-idiomas">
              <!--IDIOMAS-->
            </ul>
          </details>
        </li>
      </ul>
    </nav>
  </div>
</header>

<noscript>
  <p class="noscript" data-i18n="nav.noJs"></p>
</noscript>

<main id="top">

  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lede" data-i18n="hero.lede"></p>
        <div class="cta">
          <a class="btn btn-primary" href="#baixar" data-i18n="hero.cta.download"></a>
          <a class="btn btn-ghost" href="#aparelhos" data-i18n="hero.cta.devices"></a>
        </div>
        <p class="muted small" data-i18n="hero.count" data-i18n-vars='{"n":<!--COUNT-->,"data":"<!--DATA-->"}'></p>
      </div>

      <div class="hero-logo">
        <div class="logo-stage">
          <!--LOGO-->
        </div>
      </div>
    </div>
  </section>

  <section id="baixar" class="section">
    <div class="wrap">
      <h2 class="h2" data-i18n="downloads.title"></h2>
      <p class="muted" data-i18n="downloads.lede"></p>

      <div class="grid">
<!--RELEASES-->
      </div>
    </div>
  </section>

  <section id="verificar" class="section section-alt">
    <div class="wrap">
      <h2 class="h2" data-i18n="verify.title"></h2>
      <p class="muted" data-i18n-html="verify.lede"></p>
      <div class="steps">
        <div class="step">
          <span class="num">1</span>
          <h3 data-i18n="verify.step1"></h3>
          <ul class="links">
            <!--SUMS_LINKS-->
          </ul>
        </div>
        <div class="step">
          <span class="num">2</span>
          <h3 data-i18n="verify.step2"></h3>
          <pre><code>sha256sum -c &lt;device&gt;-SHA256SUMS</code></pre>
          <p class="muted" data-i18n-html="verify.place"></p>
        </div>
        <div class="step">
          <span class="num">3</span>
          <h3 data-i18n="verify.step3"></h3>
          <p class="muted" data-i18n-html="verify.step3note"></p>
          <ul class="links">
            <!--README_LINKS-->
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section id="cartao" class="section">
    <div class="wrap">
      <h2 class="h2" data-i18n="write.title"></h2>
      <p class="muted" data-i18n-html="write.lede"></p>
      <div class="steps">
        <div class="step">
          <span class="num">1</span>
          <h3 data-i18n="write.step1"></h3>
          <pre><code>xz -dk giochi-*.img.xz</code></pre>
          <p class="muted" data-i18n-html="write.step1note"></p>
        </div>
        <div class="step">
          <span class="num">2</span>
          <h3 data-i18n="write.step2"></h3>
          <pre><code>lsblk</code></pre>
          <p class="muted" data-i18n-html="write.step2note"></p>
        </div>
        <div class="step">
          <span class="num">3</span>
          <h3 data-i18n="write.step3"></h3>
          <pre><code>sudo dd if=giochi-*.img of=/dev/sdX \
  bs=4M conv=fsync status=progress</code></pre>
          <p class="muted" data-i18n-html="write.step3note"></p>
        </div>
        <div class="step">
          <span class="num">4</span>
          <h3 data-i18n="write.step4"></h3>
          <pre><code>sudo e2fsck -fn /dev/sdX2</code></pre>
          <p class="muted" data-i18n-html="write.step4note"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="qemu" class="section section-alt">
    <div class="wrap">
      <h2 class="h2" data-i18n="qemu.title"></h2>
      <p class="muted" data-i18n="qemu.lede"></p>
      <!--QEMU_GENERIC-->
    </div>
  </section>

  <section id="aparelhos" class="section">
    <div class="wrap">
      <h2 class="h2" data-i18n="devices.title"></h2>
      <p class="muted" data-i18n="devices.lede"></p>
      <div class="table-wrap">
        <table class="tabela">
          <thead>
            <tr>
              <th data-i18n="devices.thDevice"></th>
              <th data-i18n="devices.thId"></th>
              <th data-i18n="devices.thArch"></th>
              <th data-i18n="devices.thType"></th>
              <th data-i18n="devices.thVersion"></th>
              <th data-i18n="devices.thSize"></th>
              <th data-i18n="devices.thApps"></th>
            </tr>
          </thead>
          <tbody>
<!--DEVICE_ROWS-->
          </tbody>
        </table>
      </div>
      <p class="muted small" data-i18n-html="devices.note"></p>
    </div>
  </section>

  <section id="sobre" class="section section-alt">
    <div class="wrap">
      <h2 class="h2" data-i18n="about.title"></h2>
      <div class="cols">
        <div>
          <h3 data-i18n="about.systemTitle"></h3>
          <p class="muted" data-i18n="about.systemText"></p>
        </div>
        <div>
          <h3 data-i18n="about.appTitle"></h3>
          <p class="muted" data-i18n="about.appText"></p>
        </div>
        <div>
          <h3 data-i18n="about.gamesTitle"></h3>
          <p class="muted" data-i18n-html="about.gamesText"></p>
        </div>
        <div>
          <h3 data-i18n="about.osTitle"></h3>
          <p class="muted" data-i18n="about.osText"></p>
        </div>
      </div>

      <div class="note">
        <h3 data-i18n="about.noteTitle"></h3>
        <p class="muted" data-i18n-html="about.noteText"></p>
      </div>
    </div>
  </section>

  <section id="repos" class="section">
    <div class="wrap">
      <h2 class="h2" data-i18n="repos.title"></h2>
      <p class="muted" data-i18n="repos.lede"></p>
      <ul class="links lista-repos">
        <!--REPO_LINKS-->
      </ul>
    </div>
  </section>

  <section id="licencas" class="section section-alt">
    <div class="wrap">
      <h2 class="h2" data-i18n="license.title"></h2>
      <div class="cols">
        <div>
          <h3 data-i18n="license.systemTitle"></h3>
          <p class="muted" data-i18n-html="license.systemText"></p>
        </div>
        <div>
          <h3 data-i18n="license.appsTitle"></h3>
          <p class="muted" data-i18n="license.appsText"></p>
        </div>
      </div>
      <p class="muted small" data-i18n="license.note"></p>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <p class="muted small" data-i18n="foot.line"></p>
    <p class="muted small">
      <!--FOOTER_LINKS-->
    </p>
  </div>
</footer>

<script>
<!--SCRIPT-->
</script>

</body>
</html>
